name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend-ts/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend-ts/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-ts

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend-ts/package-lock.json

    - name: Install dependencies
      run: npm ci

    # TODO: Re-enable linting once Next.js supports ESLint 9
    # - name: Run linter
    #   run: npm run lint

    - name: Run tests
      run: npm run test:run

    - name: Test Summary
      if: always()
      run: |
        echo "## Frontend Test Results" >> $GITHUB_STEP_SUMMARY
        if [ $? -eq 0 ]; then
          echo "✅ All frontend tests passed!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Some frontend tests failed" >> $GITHUB_STEP_SUMMARY
        fi
