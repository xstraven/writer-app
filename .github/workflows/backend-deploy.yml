name: Backend Deploy

on:
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "alembic/**"
      - "scripts/setup_neon.py"
      - "modal_app.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-deploy.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve database URL
        env:
          DB_URL: ${{ secrets.STORYCRAFT_NEON_DATABASE_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Missing STORYCRAFT_NEON_DATABASE_URL secret."
            exit 1
          fi

          # Normalize accidental multi-line/labelled secret values.
          DB_URL_CLEAN="$(printf '%s\n' "$DB_URL" | tr -d '\r' | sed '/^[[:space:]]*$/d' | head -n1)"
          DB_URL_CLEAN="${DB_URL_CLEAN#URI: }"
          DB_URL_CLEAN="$(printf '%s' "$DB_URL_CLEAN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          case "$DB_URL_CLEAN" in
            postgresql://*|postgresql+psycopg://*|postgres://*) ;;
            *)
              echo "Invalid STORYCRAFT_NEON_DATABASE_URL secret format."
              echo "Expected a single raw Postgres URL, e.g. postgresql://user:pass@host/db"
              exit 1
              ;;
          esac

          echo "STORYCRAFT_NEON_DATABASE_URL=$DB_URL_CLEAN" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Run database migrations
        run: uv run alembic upgrade head

  deploy-modal:
    needs: migrate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve database URL
        env:
          DB_URL: ${{ secrets.STORYCRAFT_NEON_DATABASE_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Missing STORYCRAFT_NEON_DATABASE_URL secret."
            exit 1
          fi

          DB_URL_CLEAN="$(printf '%s\n' "$DB_URL" | tr -d '\r' | sed '/^[[:space:]]*$/d' | head -n1)"
          DB_URL_CLEAN="${DB_URL_CLEAN#URI: }"
          DB_URL_CLEAN="$(printf '%s' "$DB_URL_CLEAN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          case "$DB_URL_CLEAN" in
            postgresql://*|postgresql+psycopg://*|postgres://*) ;;
            *)
              echo "Invalid STORYCRAFT_NEON_DATABASE_URL secret format."
              echo "Expected a single raw Postgres URL, e.g. postgresql://user:pass@host/db"
              exit 1
              ;;
          esac

          echo "STORYCRAFT_NEON_DATABASE_URL=$DB_URL_CLEAN" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Deploy backend to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uv run modal deploy modal_app.py
