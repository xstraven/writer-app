name: Migration Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - "alembic/**"
      - "src/storycraft/app/db/**"
      - "scripts/setup_neon.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/migration-check.yml"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "alembic/**"
      - "src/storycraft/app/db/**"
      - "scripts/setup_neon.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/migration-check.yml"

jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: storycraft_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d storycraft_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      STORYCRAFT_NEON_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storycraft_ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Upgrade schema to head
        run: uv run alembic upgrade head

      - name: Downgrade schema to base
        run: uv run alembic downgrade base

      - name: Re-upgrade schema to head
        run: uv run alembic upgrade head
